name: Build & Release NodeDeck

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Full Verification & Privacy Gate
        run: node scripts/verify-all.mjs

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows Release Binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Package Windows Portable Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/NodeDeck.exe dist/NodeDeck-windows-x64.exe
          Copy-Item config.example.json dist/config.example.json
          Compress-Archive -Path dist/NodeDeck-windows-x64.exe, dist/config.example.json -DestinationPath dist/NodeDeck-windows-x64-portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodedeck-windows
          path: |
            dist/NodeDeck-windows-x64.exe
            dist/NodeDeck-windows-x64-portable.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
            dmg_name: NodeDeck-macos-arm64.dmg
            run_native_tests: true
          - target: x86_64-apple-darwin
            arch_label: x64
            dmg_name: NodeDeck-macos-x64.dmg
            run_native_tests: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.arch_label }}

      - name: Run Rust Unit Tests (native arch)
        if: matrix.run_native_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Build macOS .app Bundle (Tauri v2)
        env:
          CI: true
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles app

      - name: Package macOS .dmg (Headless UDZO)
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found!" >&2
            exit 1
          fi
          mkdir -p dist dmg-stage
          cp -R "$APP_PATH" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "NodeDeck" -srcfolder dmg-stage -ov -format UDZO "dist/${{ matrix.dmg_name }}"
          ls -lh "dist/${{ matrix.dmg_name }}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodedeck-macos-${{ matrix.arch_label }}
          path: dist/${{ matrix.dmg_name }}
          if-no-files-found: error

  publish-release:
    name: Publish Unified Release & SHA-256 Checksums
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Public SHA256SUMS.txt & Release Notes
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-assets

          WIN_EXE_HASH=$(sha256sum release-assets/NodeDeck-windows-x64.exe | awk '{print $1}')
          WIN_ZIP_HASH=$(sha256sum release-assets/NodeDeck-windows-x64-portable.zip | awk '{print $1}')
          MAC_ARM_HASH=$(sha256sum release-assets/NodeDeck-macos-arm64.dmg | awk '{print $1}')
          MAC_X64_HASH=$(sha256sum release-assets/NodeDeck-macos-x64.dmg | awk '{print $1}')

          {
            echo "# NodeDeck Release SHA-256 Checksums (Built cleanly by GitHub Actions)"
            echo "${WIN_EXE_HASH}  NodeDeck-windows-x64.exe"
            echo "${WIN_ZIP_HASH}  NodeDeck-windows-x64-portable.zip"
            echo "${MAC_ARM_HASH}  NodeDeck-macos-arm64.dmg"
            echo "${MAC_X64_HASH}  NodeDeck-macos-x64.dmg"
            for f in \
              src-tauri/assets/remote_agent.py \
              src-tauri/assets/remote_agent_alpine.sh \
              src-tauri/src/lib.rs \
              src-tauri/src/commands.rs \
              src-tauri/src/config.rs \
              src-tauri/src/mihomo.rs \
              src-tauri/src/ssh_client.rs \
              src-tauri/src/accounts.rs \
              src-tauri/src/tunnel.rs \
              src-tauri/src/terminal.rs \
              src/utils/client-export.js \
              src/utils/qrcode.js \
              scripts/privacy-check.mjs \
              scripts/verify-all.mjs; do
              if [ -f "$f" ]; then
                sha256sum "$f"
              fi
            done
          } > release-assets/SHA256SUMS.txt

          cat > release_notes.md <<EOF
          ## 🔒 零遥测 · 纯本地运行承诺 / Zero-Telemetry & Local-Only

          - **无服务端 / 无云端中转**：NodeDeck 不连接任何作者服务器，无统计埋点、无配置上传。
          - **数据纯本地**：Windows 存于程序同目录，macOS 安装版存于 \`~/Library/Application Support/com.nodedeck.desktop/\`。
          - **可复现公开构建**：下方 Windows 与 macOS 安装包均直接由 GitHub Actions 公开流水线从本仓库源码编译生成。

          ## 🍎 macOS 首次打开提示（开源未付费签名）

          由于本项目为个人开源免费软件，未使用 Apple 付费开发者证书公证，macOS 首次打开若提示「已损坏」或「无法验证开发者」，请拖入「应用程序」后在终端执行一次：
          \`\`\`bash
          xattr -cr /Applications/NodeDeck.app
          \`\`\`

          ## 🔐 SHA-256 文件完整性校验

          | 平台与文件 | SHA-256 |
          | :--- | :--- |
          | \`NodeDeck-windows-x64.exe\` (Windows x64 单文件) | \`${WIN_EXE_HASH}\` |
          | \`NodeDeck-windows-x64-portable.zip\` (Windows 便携包) | \`${WIN_ZIP_HASH}\` |
          | \`NodeDeck-macos-arm64.dmg\` (macOS Apple Silicon M1–M4) | \`${MAC_ARM_HASH}\` |
          | \`NodeDeck-macos-x64.dmg\` (macOS Intel) | \`${MAC_X64_HASH}\` |

          本地一键校验命令：
          - **Windows (PowerShell)**：\`Get-FileHash .\NodeDeck-windows-x64.exe -Algorithm SHA256\`
          - **macOS (Terminal)**：\`shasum -a 256 NodeDeck-macos-arm64.dmg\`

          完整源码与产物校验清单见附件 \`SHA256SUMS.txt\`。
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            release-assets/NodeDeck-windows-x64.exe
            release-assets/NodeDeck-windows-x64-portable.zip
            release-assets/NodeDeck-macos-arm64.dmg
            release-assets/NodeDeck-macos-x64.dmg
            release-assets/SHA256SUMS.txt
