[package]
name = "nodedeck"
version = "1.2.0"
description = "NodeDeck — Zero-telemetry, 100% local-only Rust + Tauri v2 desktop workbench for Linux VPS, Alpine NAT, sing-box, Zashboard-style Mihomo DIY control, offline config/QR generation, and isolated multi-account sandboxes"
authors = ["NodeDeck Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "nodedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NodeDeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
